# Entorno de desarrollo: engine + Moodle (con el plugin montado) + MariaDB.
#
# Uso:
#   CONTENT_REPO=/ruta/al/clon/contenidos docker compose up --build
#   Engine: http://localhost:8000/health  ·  Moodle: http://localhost:8080
#
# En Moodle, `config.php`: $CFG->local_liamateriales_service_url = 'http://engine:8000';
# y en los ajustes del plugin, la URL del editor LiaEdit self-hosted.
#
# El editor (fork FPVirtual/LiveEditor) se despliega aparte como estático.

services:
  engine:
    build: engine/
    # Sin puerto publicado en producción: solo Moodle habla con el engine.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CONTENT_REPO: /content
      CONTENT_REPO_URL: ${CONTENT_REPO_URL:-}
      MATERIALES_LIASCRIPT_LOG_FORMAT: console
    volumes:
      # Clon del repo de contenidos con `origin` con credenciales de escritura (D1).
      - ${CONTENT_REPO:-./content}:/content
      # Publicación con liaex: el engine lanza contenedores en el demonio del
      # host. Para docker-in-docker real, ver MATERIALES_LIASCRIPT_WORKDIR/HOST_WORKDIR
      # en engine/README.md.
      - /var/run/docker.sock:/var/run/docker.sock

  moodle:
    image: moodlehq/moodle-php-apache:latest
    ports:
      - "8080:80"
    environment:
      MOODLE_DOCKER_DBTYPE: mysqli
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: moodle
    volumes:
      - moodle-data:/var/www/moodledata
      - ./plugin:/var/www/html/local/liamateriales:ro
    depends_on:
      - db
      - engine

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_ROOT_PASSWORD: root-dev-cambiar
    volumes:
      - db-data:/var/lib/mysql

volumes:
  moodle-data:
  db-data:
