[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courseascode"
version = "2.0.0"
description = "Engine LiaEditor–Moodle: ramas de edición y guardado en Git, y publicación de materiales LiaScript (H5P/ePub/PDF) con liaex."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "GitPython>=3.1.43",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "structlog>=24.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/courseascode"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "PL", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["courseascode", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
